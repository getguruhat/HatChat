name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships the Android SDK; this just caches Gradle.
      - uses: gradle/actions/setup-gradle@v6

      # Decodes the permanent signing key if the repo has it (secrets aren't available on fork PRs).
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HATCHAT_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hatchat.p12"
          echo "HATCHAT_KEYSTORE_FILE=$RUNNER_TEMP/hatchat.p12" >> "$GITHUB_ENV"
        shell: bash

      - name: Build APK
        env:
          HATCHAT_KEYSTORE_PASSWORD: ${{ secrets.HATCHAT_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HatChat-${{ github.ref_name == 'main' && github.sha || github.ref_name }}.apk
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: HatChat-apk
          path: HatChat-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: HatChat-*.apk
